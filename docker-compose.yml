services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chico_rei}
      MYSQL_USER: ${DB_USERNAME:-chico_rei}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./chico-rei-api
    # Instala dependências caso o volume do código esconda o vendor da imagem.
    command: >
      sh -c "composer install --no-interaction
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-chico_rei}
      DB_USERNAME: ${DB_USERNAME:-chico_rei}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./chico-rei-api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./chico-rei-web
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./chico-rei-web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
  web-node-modules:
