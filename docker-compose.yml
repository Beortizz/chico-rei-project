services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chico_rei}
      MYSQL_USER: ${DB_USERNAME:-chico_rei}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    environment:
      discovery.type: single-node
      # Segurança desligada: uso apenas em desenvolvimento local.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./chico-rei-api
    # Instala dependências caso o volume do código esconda o vendor da imagem.
    command: >
      sh -c "composer install --no-interaction
      && php artisan migrate --force
      && php artisan storage:link --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-chico_rei}
      DB_USERNAME: ${DB_USERNAME:-chico_rei}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    volumes:
      - ./chico-rei-api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build: ./chico-rei-api
    # --tries/--timeout aqui são só o padrão; cada job pode definir os seus.
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-chico_rei}
      DB_USERNAME: ${DB_USERNAME:-chico_rei}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    volumes:
      - ./chico-rei-api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./chico-rei-web
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./chico-rei-web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
  elasticsearch-data:
  web-node-modules:
