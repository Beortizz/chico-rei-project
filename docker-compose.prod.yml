name: store-prod

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?defina APP_KEY no .env.production}
  APP_URL: ${APP_URL:?defina APP_URL no .env.production}
  APP_LOCALE: pt_BR
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?defina DB_HOST no .env.production}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env.production}
  DB_USERNAME: ${DB_USERNAME:?defina DB_USERNAME no .env.production}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env.production}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?defina SANCTUM_STATEFUL_DOMAINS no .env.production}
  FRONTEND_URL: ${APP_URL}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  ELASTICSEARCH_HOST: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: products

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: store-app:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      <<: *app-environment
      SERVER_NAME: ${SERVER_NAME:-:80}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - app-storage:/app/storage/app
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:80/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  queue:
    image: store-app:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
    environment:
      <<: *app-environment
    depends_on:
      app:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  caddy-data:
  caddy-config:
  elasticsearch-data:
